name: Seldon Fleet CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-and-build:
    name: Analise Estatica, Testes JVM e Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Garantir permissao de execucao do Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verificar isolamento arquitetural de domain (REQ-04)
        run: |
          if grep -r "import android" app/src/main/java/br/edu/uea/seldonfleet/domain/; then
            echo "Erro: import android encontrado em domain/"
            exit 1
          fi

      - name: Executar Analise Estatica (Android Lint - REQ-09)
        run: ./gradlew lintDebug

      - name: Executar Testes Unitarios na JVM via ./gradlew test (REQ-08, REQ-09)
        run: ./gradlew test

      - name: Gerar APK de Debug para instalacao
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para download nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seldon-fleet-apk
          path: app/build/outputs/apk/debug/app-debug.apk
